name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep lint rules aligned with the validated development toolchain.
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            tools/content-build
      # libclang: bindgen in signalsmith-stretch's build script (Lemon Sampler's time stretching, C++).
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libclang-dev
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo check --workspace --target wasm32-unknown-unknown
      - name: Content tool
        run: cargo test --manifest-path tools/content-build/Cargo.toml

  android:
    # Build the real APK on the generator branch so Android compatibility is checked, not inferred.
    if: github.ref == 'refs/heads/honeydew-generator-full-song-export'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-arm-debug
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK and NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.0.13004108'
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build Android APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
          tools/android-dist.sh --base
      - uses: actions/upload-artifact@v4
        with:
          name: honeydew-android-arm-base-debug
          path: target/honeydew-android-*-arm-base-debug.apk
          if-no-files-found: error
          retention-days: 14

  native-multicore:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
      - name: libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llvm = 'C:\Program Files\LLVM\bin'
          if (-not (Test-Path "$llvm\libclang.dll")) { choco install llvm -y --no-progress }
          "LIBCLANG_PATH=$llvm" >> $env:GITHUB_ENV
      - run: cargo test --locked --lib parallel_racks_match_sequential_through_sends_and_live_toggle
