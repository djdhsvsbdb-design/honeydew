name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev pkg-config
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Build release binary
      run: cargo build --release --locked --bins
    - name: Package desktop downloads
      run: RUNNER_OS=Linux bash tools/package-desktop.sh "honeydew-main-linux-x86_64" target/release
    - name: Upload downloadable packages
      uses: actions/upload-artifact@v4
      with:
        name: Honeydew-Linux-download
        path: |
          honeydew-main-linux-x86_64.tar.gz
          honeydew-main-linux-x86_64-no-sounds.tar.gz
        retention-days: 30
